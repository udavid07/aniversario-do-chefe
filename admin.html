<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Painel privado | Aniversário</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="admin.css">
</head>

<body>

    <main class="admin-shell">

        <section class="login-card" id="login-card">

            <div class="admin-icon">🔐</div>

            <span class="eyebrow">ÁREA PRIVADA</span>

            <h1>Painel do aniversariante</h1>

            <p>
                Entre com sua conta para visualizar e gerenciar
                as mensagens recebidas.
            </p>

            <form id="login-form">

                <label for="email">E-mail</label>

                <input
                    type="email"
                    id="email"
                    placeholder="seu@email.com"
                    autocomplete="email"
                    required
                >

                <label for="password">Senha</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Sua senha"
                    autocomplete="current-password"
                    required
                >

                <button type="submit" id="login-button">
                    🔑 Entrar
                </button>

                <p
                    id="login-feedback"
                    class="feedback"
                    role="alert"
                ></p>

            </form>

            <a href="index.html" class="back-link">
                ← Voltar para o aniversário
            </a>

        </section>


        <section class="dashboard" id="dashboard" hidden>

            <header class="dashboard-header">

                <div>
                    <span class="eyebrow">ÁREA PRIVADA</span>
                    <h1>Mensagens recebidas 💚</h1>
                    <p id="admin-email"></p>
                </div>

                <div class="header-actions">

                    <span class="count-badge">
                        <strong id="message-count">0</strong>
                        mensagens
                    </span>

                    <button
                        type="button"
                        class="secondary-button"
                        id="refresh-button"
                    >
                        🔄 Atualizar
                    </button>

                    <button
                        type="button"
                        class="danger-button"
                        id="logout-button"
                    >
                        Sair
                    </button>

                </div>

            </header>


            <div
                id="admin-feedback"
                class="admin-feedback"
                role="status"
                aria-live="polite"
            ></div>


            <section
                id="admin-messages"
                class="admin-messages"
            ></section>


            <div
                id="admin-empty"
                class="admin-empty"
                hidden
            >
                <div>💌</div>
                <h2>Nenhuma mensagem ainda</h2>
                <p>
                    Quando alguém enviar uma mensagem,
                    ela aparecerá aqui.
                </p>
            </div>

        </section>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="admin.js"></script>

</body>
</html>
